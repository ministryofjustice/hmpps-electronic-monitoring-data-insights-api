<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Person search results</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #fff; color: #17212b; font: 16px/1.5 Arial, sans-serif; }
    main { padding: 24px; max-width: 1800px; margin: auto; }
    header { border-bottom: 4px solid #17212b; padding-bottom: 16px; margin-bottom: 24px; }
    h1 { margin: 4px 0; font-size: 28px; }
    h2 { margin: 24px 0 12px; font-size: 22px; }
    p { margin: 8px 0; }
    .secondary { color: #505b65; }
    .delius-columns { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 32px; align-items: start; }
    dl { display: grid; grid-template-columns: minmax(100px, 140px) minmax(0, 1fr); margin: 0; }
    dt, dd { padding: 10px 0; margin: 0; border-bottom: 1px solid #cdd3d8; overflow-wrap: anywhere; }
    dt { font-weight: bold; }
    .table-scroll { overflow-x: auto; }
    table { width: 100%; min-width: 1150px; border-collapse: collapse; text-align: left; }
    th, td { padding: 12px; border-bottom: 1px solid #cdd3d8; vertical-align: top; overflow-wrap: normal; word-break: normal; white-space: nowrap; }
    th { background: #f2f5f7; }
    .identifier { min-width: 180px; }
    .identifier span { display: inline-block; min-width: 70px; color: #505b65; }
    @media (max-width: 1000px) { .delius-columns { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 650px) { .delius-columns { grid-template-columns: 1fr; gap: 16px; } }
    @media (max-width: 500px) { main { padding: 16px; } dl { grid-template-columns: 110px 1fr; } }
    @media print {
      @page { size: landscape; margin: 10mm; }
      main { padding: 0; max-width: none; }
      .delius-columns { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; break-inside: avoid; }
      .table-scroll { overflow: visible; }
      table { min-width: 0; font-size: 10px; table-layout: fixed; }
      th, td { padding: 5px; white-space: normal; overflow-wrap: anywhere; }
      .identifier { min-width: 0; }
      .identifier span { min-width: 0; display: block; }
      tr { break-inside: avoid; }
      thead { display: table-header-group; }
    }
  </style>
</head>
<body>
<main>
  <header><p class="secondary">Electronic monitoring · Diagnostic search</p><h1>Person search results</h1></header>
  <section aria-labelledby="delius-heading"><h2 id="delius-heading">Delius details</h2>{{DELIUS}}</section>
  <section aria-labelledby="athena-heading"><h2 id="athena-heading">Athena results ({{COUNT}})</h2>{{RESULTS}}</section>
</main>
</body>
</html>
